apiVersion: v1
kind: Namespace
metadata:
  name: crypto-security
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crypto-node-ubuntu
  namespace: crypto-security
spec:
  replicas: 3
  selector:
    matchLabels:
      app: crypto-node
      role: webserver
  template:
    metadata:
      labels:
        app: crypto-node
        role: webserver
    spec:
      containers:
      - name: node
        image: yourusername/crypto_ubuntu:latest
        ports:
        - containerPort: 5000
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crypto-node-alpine
  namespace: crypto-security
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crypto-node
      role: api-gateway
  template:
    metadata:
      labels:
        app: crypto-node
        role: api-gateway
    spec:
      containers:
      - name: node
        image: yourusername/crypto_alpine:latest
        ports:
        - containerPort: 5000
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "300m"
